    const chartValues = {};
    function drawTrendChart(id, values, color = "var(--fg-accent)") {
      chartValues[id] = { values, color };
      const svg = document.getElementById(id);
      const w = 300;
      const h = 128;
      const known = values.filter((v) => v != null);
      const rawMin = Math.min(...known);
      const rawMax = Math.max(...known);
      const pad = Math.max((rawMax - rawMin) * 0.08, 0.2);
      const minV = rawMin - pad;
      const maxV = rawMax + pad;
      const span = Math.max(maxV - minV, 0.1);
      const slots = Math.max(known.length - 1, 1);
      const edge = 6;
      const plotW = w - 2 * edge;
      const plotH = h - 2 * edge;
      const pts = known.map((v, i) => {
        const x = edge + (plotW * i) / slots;
        const y = edge + plotH * (1 - (v - minV) / span);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const first = pts[0].split(",");
      const last = pts[pts.length - 1].split(",");
      const fill = `${first[0]},${h} ${pts.join(" ")} ${last[0]},${h}`;
      const box = svg.getBoundingClientRect();
      const rx = box.width > 0 ? (4 * w) / box.width : 4;
      const ry = box.height > 0 ? (4 * h) / box.height : 4;
      svg.innerHTML = `
        <polygon points="${fill}" fill="color-mix(in srgb, ${color} 16%, transparent)" />
        <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" />
        <ellipse cx="${last[0]}" cy="${last[1]}" rx="${rx.toFixed(2)}" ry="${ry.toFixed(2)}" fill="${color}" />
      `;
    }

    const redrawCharts = () => {
      Object.entries(chartValues).forEach(([id, entry]) => drawTrendChart(id, entry.values, entry.color));
    };
    new ResizeObserver(() => {
      if (homeTab === "statistics") redrawCharts();
    }).observe(document.getElementById("pane-stats"));

    const calorieSeries = [980, 1120, 1340, 1510, 1680, 1840, 2040, 2200];
    drawTrendChart("stCalorieChart", calorieSeries);
    paintAxis("stCalorieAxis", axisLabels(calorieSeries));
    paintDays();
    slideHome(true);
    scrollSelectedDayChip(false);
    paintStreak();

    pauseBtn.addEventListener("click", () => {
      haptic.light();
      paused = !paused;
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", next);
    document.getElementById("prevBtn").addEventListener("click", prev);
    document.getElementById("workoutClose").addEventListener("click", restart);
    document.getElementById("complete").addEventListener("click", restart);
    window.goNext = next;

    let lastHomeTick = 0;
    let lastHomeAbsTick = 0;
    let lastFreeDayTick = 0;
    let freeDayFrame = 0;
    let lastShoulderTick = 0;
    let shoulderFrame = 0;
    let lastAbsCardTick = 0;
    let absCardFrame = 0;
    let lastWorkoutTick = 0;
    let lastCharmTick = 0;
    let absHolding = false;
    let homeAbsHolding = false;
    let homeAbsFrame = 0;
    const absLoopPauseMs = 500;
    function paintSplashAbs() {
      splashChicken.src = seqAbs[homeFrame];
    }
    function paintHomeAbs() {
      const src = seqAbs[homeAbsFrame];
      document.querySelectorAll(".abs-preview-chicken").forEach((img) => {
        img.src = src;
      });
    }
    function advanceAbs(now) {
      const wait = absHolding ? absLoopPauseMs : 1000 / 10;
      if (now - lastHomeTick < wait) return;
      lastHomeTick = now;
      if (absHolding) {
        absHolding = false;
        homeFrame = 0;
        paintSplashAbs();
        return;
      }
      if (homeFrame >= seqAbs.length - 1) {
        absHolding = true;
        return;
      }
      homeFrame += 1;
      paintSplashAbs();
    }
    function advanceHomeAbs(now) {
      const wait = homeAbsHolding ? absLoopPauseMs : 1000 / 10;
      if (now - lastHomeAbsTick < wait) return;
      lastHomeAbsTick = now;
      if (homeAbsHolding) {
        homeAbsHolding = false;
        homeAbsFrame = 0;
        paintHomeAbs();
        return;
      }
      if (homeAbsFrame >= seqAbs.length - 1) {
        homeAbsHolding = true;
        return;
      }
      homeAbsFrame += 1;
      paintHomeAbs();
    }
    function mediaLoop(now) {
      requestAnimationFrame(mediaLoop);
      if (splashOn) {
        advanceAbs(now);
        return;
      }
      if (phase === "home" && homeTab === "workouts" && !settingsOpen && !notesOpen) {
        advanceHomeAbs(now);
        if (now - lastShoulderTick >= 1000 / 3) {
          lastShoulderTick = now;
          shoulderFrame = (shoulderFrame + 1) % seq04.length;
          document.querySelectorAll('.wo-frames[data-frames="shoulder"]').forEach((img) => {
            img.src = seq04[shoulderFrame];
          });
        }
        if (now - lastAbsCardTick >= 1000 / 9) {
          lastAbsCardTick = now;
          absCardFrame = (absCardFrame + 1) % seq01.length;
          document.querySelectorAll('.wo-frames[data-frames="abs"]').forEach((img) => {
            img.src = seq01[absCardFrame];
          });
        }
      }
      if (phase === "home" && homeTab === "home" && !settingsOpen && !notesOpen) {
        advanceHomeAbs(now);
        if (now - lastFreeDayTick >= 1000 / 6) {
          lastFreeDayTick = now;
          freeDayFrame = (freeDayFrame + 1) % freeDayFrames.length;
          document.querySelectorAll(".free-day-chicken").forEach((img) => {
            img.src = freeDayFrames[freeDayFrame];
          });
        }
      }
      if (phase === "workout" && (!paused || announcing)) {
        const move = moves[index];
        if (move.frames && now - lastWorkoutTick >= 1000 / (move.fps || 10)) {
          lastWorkoutTick = now;
          workoutFrame = (workoutFrame + 1) % move.frames.length;
          chicken.src = move.frames[workoutFrame];
        }
      }
      if (phase === "complete" && now - lastCharmTick >= 1000 / 10) {
        lastCharmTick = now;
        charmFrame = (charmFrame + 1) % seqCharm.length;
        charmChicken.src = seqCharm[charmFrame];
      }
    }
    requestAnimationFrame(mediaLoop);

    setInterval(() => {
      if (phase === "workout" && !paused && !transitioning) {
        elapsed += 0.25;
        if (elapsed >= (moves[index]?.duration ?? 100)) {
          elapsed = moves[index]?.duration ?? 100;
          paintTimer();
          next();
          return;
        }
        paintTimer();
        cueRep();
      }
    }, 250);

    window.setTimeout(() => haptic.medium(), 160);
    window.setTimeout(() => {
      haptic.light();
      splashOn = false;
      render();
    }, 2000);

    render();
  </script>
</body>
</html>
