<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chicken — iOS preview</title>
  <style>
    @font-face {
      font-family: "Workear Font";
      src: url("../Chicken/Fonts/WorkearFont-Regular.ttf") format("truetype");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #1a1210;
      font-family: "Workear Font", ui-rounded, sans-serif;
    }
    body { display: grid; place-items: center; }
    .phone {
      width: 402px;
      height: 874px;
      position: relative;
      overflow: hidden;
      background: #fcf6ea;
      color: #301a1a;
    }
    .paper {
      position: absolute;
      inset: 0;
      background: url("../Chicken/Assets.xcassets/PaperTexture.imageset/PaperTexture.png") center / cover no-repeat;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 3;
    }
    .header {
      position: absolute;
      top: 60px;
      left: 16px;
      right: 16px;
      z-index: 2;
    }
    .move-label { font-size: 12px; line-height: 14px; color: #826d5e; }
    .pips { display: flex; gap: 10px; margin-top: 10px; }
    .pip { flex: 1; height: 8px; border-radius: 999px; border: 1px solid #ef6856; }
    .pip.filled { background: #ef6856; }
    .timer-block { position: absolute; top: 141px; left: 0; right: 0; text-align: center; z-index: 2; }
    .time { font-size: 84px; line-height: 84px; }
    .move-name { font-size: 20px; line-height: 32px; color: rgba(0,0,0,0.4); }
    .chicken {
      position: absolute;
      left: 0;
      right: 0;
      top: 250px;
      bottom: 120px;
      display: grid;
      place-items: center;
    }
    .chicken img {
      width: 100%;
      height: auto;
      object-fit: contain;
      transform: scale(1.42);
      transform-origin: center center;
    }
    .controls {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 32px;
      display: flex;
      gap: 12px;
      z-index: 2;
    }
    .pause {
      width: 72px;
      height: 72px;
      border: 0;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 0.9px 1.35px rgba(0,0,0,0.1);
    }
    .next {
      flex: 1;
      height: 72px;
      border: 0;
      border-radius: 25px;
      background: #ef6856;
      color: #fefcf4;
      font: 20px/1 "Workear Font", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="paper"></div>
    <div class="header">
      <div class="move-label">Move 3 of 4</div>
      <div class="pips">
        <div class="pip filled"></div>
        <div class="pip filled"></div>
        <div class="pip filled"></div>
        <div class="pip"></div>
      </div>
    </div>
    <div class="timer-block">
      <div class="time">4:38</div>
      <div class="move-name">Overhead press</div>
    </div>
    <div class="chicken">
      <img src="../Chicken/Frames/Sequence01/frame_012.jpg" alt="Overhead press" />
    </div>
    <div class="controls">
      <button class="pause" aria-label="Pause">
        <img src="../Chicken/Assets.xcassets/IconPause.imageset/icon-pause.svg" width="32" height="32" alt="" />
      </button>
      <button class="next">
        Next
        <img src="../Chicken/Assets.xcassets/IconArrow.imageset/icon-arrow.svg" width="32" height="32" alt="" />
      </button>
    </div>
  </div>
</body>
</html>
