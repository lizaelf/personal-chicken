<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chicken — iOS preview</title>
  <style>
    @font-face {
      font-family: "Workear Font";
      src: url("../Chicken/Fonts/WorkearFont-Regular.ttf") format("truetype");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow-x: hidden;
      background: #fcf6ea;
      font-family: "Workear Font", ui-rounded, sans-serif;
    }
    body { min-height: 100dvh; }
    .phone {
      width: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background: #fcf6ea;
      color: #301a1a;
    }
    .paper {
      position: absolute;
      inset: 0;
      background: url("../Chicken/Assets.xcassets/PaperTexture.imageset/PaperTexture.png") center / 100% 100% no-repeat;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 0;
    }
    .header {
      position: absolute;
      top: max(52px, 6vh);
      left: 4vw;
      right: 4vw;
      z-index: 2;
    }
    .move-label { font-size: clamp(12px, 3vw, 16px); line-height: 1.2; color: #826d5e; }
    .pips { display: flex; width: 100%; gap: 10px; margin-top: 10px; }
    .pip { flex: 1 1 0; min-width: 0; height: 8px; border-radius: 999px; border: 1px solid #ef6856; }
    .pip.filled { background: #ef6856; }
    .timer-block { position: absolute; top: 16vh; left: 0; right: 0; text-align: center; z-index: 2; }
    .time { font-size: clamp(52px, 21vw, 96px); line-height: 1; }
    .move-name { font-size: clamp(16px, 5vw, 24px); line-height: 1.4; color: rgba(0,0,0,0.4); }
    .chicken {
      position: absolute;
      left: 0;
      right: 0;
      top: 28vh;
      bottom: 18vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      z-index: 1;
    }
    .chicken img {
      width: 100%;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }
    .controls {
      position: absolute;
      left: 4vw;
      right: 4vw;
      bottom: 4vh;
      display: flex;
      gap: 3vw;
      z-index: 2;
    }
    .pause {
      width: 18vw;
      height: 18vw;
      max-width: 80px;
      max-height: 80px;
      border: 0;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 0.9px 1.35px rgba(0,0,0,0.1);
    }
    .next {
      flex: 1;
      height: 18vw;
      max-height: 80px;
      border: 0;
      border-radius: 25px;
      background: #ef6856;
      color: #fefcf4;
      font: clamp(16px, 5vw, 22px)/1 "Workear Font", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="paper"></div>
    <div class="header">
      <div class="move-label">Move 3 of 4</div>
      <div class="pips">
        <div class="pip filled"></div>
        <div class="pip filled"></div>
        <div class="pip filled"></div>
        <div class="pip"></div>
      </div>
    </div>
    <div class="timer-block">
      <div class="time">4:38</div>
      <div class="move-name">Overhead press</div>
    </div>
    <div class="chicken">
      <img src="../Chicken/Frames/Sequence01/frame_012.jpg" alt="Overhead press" />
    </div>
    <div class="controls">
      <button class="pause" aria-label="Pause">
        <img src="../Chicken/Assets.xcassets/IconPause.imageset/icon-pause.svg" width="32" height="32" alt="" />
      </button>
      <button class="next">
        Next
        <img src="../Chicken/Assets.xcassets/IconArrow.imageset/icon-arrow.svg" width="32" height="32" alt="" />
      </button>
    </div>
  </div>
</body>
</html>
